degradation:
  random_mpeg:
    params:
      prob: 0.5
      codec: ['libx264','libx265']
      codec_prob: [0.4, 0.6]
      preset_list: ['ultrafast', 'superfast', 'veryfast', 'faster', 'fast', 'medium', 'slow']
      crf_range: [12, 20]
      264_crf_shift: 2
      gblur_sigma_range: [0.01, 0.1]
    keys: [ 'lqs' ]

degradation_1:
  random_pipe_prob: 0.2
  random_blur:
    params:
      kernel_size: [ 7, 9, 11, 13, 15, 17, 19, 21 ]
      kernel_list: [ 'iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso', 'sinc' ]
      kernel_prob: [ 0.405, 0.225, 0.108, 0.027, 0.108, 0.027, 0.1 ]
      sigma_x: [ 0.2, 3 ]
      sigma_y: [ 0.2, 3 ]
      rotate_angle: [ -3.1416, 3.1416 ]
      beta_gaussian: [ 0.5, 4 ]
      beta_plateau: [ 1, 2 ]
      sigma_x_step: 0.02
      sigma_y_step: 0.02
      rotate_angle_step: 0.31416
      beta_gaussian_step: 0.05
      beta_plateau_step: 0.1
      omega_step: 0.0628
    keys: [ 'lqs' ]
  random_resize:
    params:
      resize_mode_prob: [ 0.2, 0.7, 0.1 ]  # up, down, keep
      resize_scale: [ 0.5, 1.5 ]
      resize_opt: [ 'bilinear', 'area', 'bicubic' ]
      resize_prob: [ 0.3333, 0.3333, 0.3334 ]
      resize_step: 0
      is_size_even: True
    keys: [ 'lqs' ]
  random_noise:
    params:
      prob: 0.8
      noise_type: [ 'gaussian', 'poisson' ]
      noise_prob: [ 0.5, 0.5 ]
      gaussian_sigma: [ 0.1, 3 ]
      gaussian_gray_noise_prob: 0.4
      poisson_scale: [ 0.05, 0.5 ]
      poisson_gray_noise_prob: 0.4
      gaussian_sigma_step: 0.01
      poisson_scale_step: 0.005
    keys: [ 'lqs' ]
  random_jpeg:
    params:
      prob: 0.8
      quality: [ 50, 95 ]
      quality_step: 1
    keys: [ 'lqs' ]
  random_mpeg:
    params:
      prob: 0.5
      codec: ['libx264','libx265']
      codec_prob: [0.4, 0.6]
      preset_list: ['ultrafast', 'superfast', 'veryfast', 'faster', 'fast', 'medium', 'slow']
      crf_range: [18, 26]
      264_crf_shift: 3
      gblur_sigma_range: [0.01, 0.1]
    keys: [ 'lqs' ]

degradation_2:
  random_pipe_prob: 0.2
  random_blur:
    params:
      prob: 0.8
      kernel_size: [ 7, 9, 11, 13, 15, 17, 19, 21 ]
      kernel_list: [ 'iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso', 'sinc' ]
      kernel_prob: [ 0.405, 0.225, 0.108, 0.027, 0.108, 0.027, 0.1 ]
      sigma_x: [ 0.2, 1.5 ]
      sigma_y: [ 0.2, 1.5 ]
      rotate_angle: [ -3.1416, 3.1416 ]
      beta_gaussian: [ 0.5, 4 ]
      beta_plateau: [ 1, 2 ]
      sigma_x_step: 0.02
      sigma_y_step: 0.02
      rotate_angle_step: 0.31416
      beta_gaussian_step: 0.05
      beta_plateau_step: 0.1
      omega_step: 0.0628
    keys: [ 'lqs' ]
  random_resize:
    params:
      resize_mode_prob: [ 0.3, 0.4, 0.3 ]  # up, down, keep
      resize_scale: [ 0.3, 1.2 ]
      resize_opt: [ 'bilinear', 'area', 'bicubic' ]
      resize_prob: [ 0.3333, 0.3333, 0.3334 ]
      resize_step: 0
      is_size_even: True
    keys: [ 'lqs' ]
  random_noise:
    params:
      prob: 0.5
      noise_type: [ 'gaussian', 'poisson' ]
      noise_prob: [ 0.5, 0.5 ]
      gaussian_sigma: [ 0.05, 5 ]
      gaussian_gray_noise_prob: 0.4
      poisson_scale: [ 0.02, 1 ]
      poisson_gray_noise_prob: 0.4
      gaussian_sigma_step: 0.02
      poisson_scale_step: 0.01
    keys: [ 'lqs' ]
  random_jpeg:
    params:
      prob: 0.8
      quality: [ 50, 95 ]
      quality_step: 1
    keys: [ 'lqs' ]
  random_mpeg:
    params:
      prob: 0.5
      codec: ['libx264','libx265']
      codec_prob: [0.4, 0.6]
      preset_list: ['ultrafast', 'superfast', 'veryfast', 'faster', 'fast', 'medium', 'slow']
      crf_range: [18, 26]
      264_crf_shift: 3
      gblur_sigma_range: [0.01, 0.1]
    keys: [ 'lqs' ]
  random_pipe_prob_final: 0.5
  resize_final:
    params:
      resize_opt: [ 'bilinear', 'area', 'bicubic' ]
      resize_prob: [ 0.3333, 0.3333, 0.3334 ]
    keys: [ 'lqs' ]
  blur_final:
    params:
      prob: 0.8
      kernel_size: [ 7, 9, 11, 13, 15, 17, 19, 21 ]
      kernel_list: [ 'sinc' ]
      kernel_prob: [ 1 ]
      omega: [ 1.0472, 3.1416 ]
      omega_step: 0.0628
    keys: [ 'lqs' ]
  mpeg_final:
    params:
      prob: 0.9
      codec: ['libx264','libx265']
      codec_prob: [0.4, 0.6]
      preset_list: ['ultrafast', 'superfast', 'veryfast', 'faster', 'fast', 'medium', 'slow']
      crf_range: [20, 35]
      264_crf_shift: 5
      gblur_sigma_range: [0.05, 0.4]
    keys: [ 'lqs' ]

temporal_degradation:
  params:
    prob: 0.02
    corruption_ratio: [0.1, 0.3]
    corruption_type: ['repeat', 'drop_pad_last', 'interpolate']
    corruption_prob: [0.3333, 0.3333, 0.3334]
  keys: [ 'lqs', 'gts' ]

transforms:
  usm:
    params:
      prob: 0
      kernel_size: 51
      sigma: 0
      weight: 0.5
      threshold: 10
    keys: [ 'gts' ]
  clip:
    keys: [ 'lqs' ]
  rescale:
    keys: [ 'lqs', 'gts' ]
